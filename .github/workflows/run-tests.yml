name: Unit Testing for Snowflake CLI ADO extension
on: [push]
jobs:
  unit-test:
    name: Unit Test configure_snowflake_cli Task
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: tasks/configure_snowflake_cli/package-lock.json
    - name: Install dependencies
      working-directory: tasks/configure_snowflake_cli
      run: npm ci --no-audit --no-fund
    - name: Prefetch MockTestRunner Node 24
      run: |
        set -euo pipefail
        DEST="${HOME}/azure-pipelines-task-lib/_download/node24"
        VER="v24.10.0"
        mkdir -p "${DEST}"
        curl -fsSL "https://nodejs.org/dist/${VER}/node-${VER}-linux-x64.tar.gz" -o "${DEST}/node.tar.gz"
        tar -xzf "${DEST}/node.tar.gz" -C "${DEST}"
        touch "${DEST}.completed"
    - name: Run Unit Tests
      working-directory: tasks/configure_snowflake_cli
      env:
        TASK_TEST_TRACE: '1'
      run: |
        unset UV_TOOL_BIN_DIR
        npm test

    - name: Show logs
      if: failure()
      run: |
        cd tasks/configure_snowflake_cli/tests/configureSnowflakeCliTest

        for LOG_FILE in *.log; do
            if [[ -e "$LOG_FILE" ]]; then
            echo "Contents of $LOG_FILE:"
            cat "$LOG_FILE"
            echo "---------------------------------"
            fi
        done

  unit-test-cortex:
    name: Unit Test configure_cortex_code Task
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Run Unit Tests
      run: |
        cd tasks/configure_cortex_code
        export TASK_TEST_TRACE=1
        npm ci
        npm test

    - name: Show logs
      if: failure()
      run: |
        cd tasks/configure_cortex_code/tests/configureCortexCodeTest

        for LOG_FILE in *.log; do
            if [[ -e "$LOG_FILE" ]]; then
            echo "Contents of $LOG_FILE:"
            cat "$LOG_FILE"
            echo "---------------------------------"
            fi
        done
